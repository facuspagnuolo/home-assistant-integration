install_resources:
  name: Install resources
  description: Install or update Annika shared resources on Home Assistant.
send_event:
  name: Send event
  description: Sign and send a unit event to Annika's API.
  fields:
    type:
      name: Type
      description: Event type (e.g. security, system, info).
      required: true
      selector:
        text: null
    message:
      name: Message
      description: Event message content.
      required: true
      selector:
        text: null
    title:
      name: Title
      description: Optional event title.
      required: false
      selector:
        text: null
    actor:
      name: Actor
      description: Optional alias of the person who emitted the event.
      required: false
      selector:
        text: null
    event_id:
      name: Event ID
      description: Optional idempotency key, defaults to a random UUID.
      required: false
      selector:
        text: null
    view:
      name: View
      description: >-
        Path of the dashboard view to open when the resulting notification
        is tapped (e.g. timbre). Each person lands on their own dashboard: the
        view opens there if that dashboard has it, otherwise they land on the
        top of their dashboard. Required for security and info events; not
        used by system events.
      required: false
      selector:
        text: null
    navigate:
      name: Navigate
      description: >-
        Also bring the view up on this unit's paired tablets (the ones that
        don't receive notifications), and take them back to their dashboard
        after two minutes with nobody touching them. Each tablet goes to the
        view inside its own dashboard, and only if that dashboard has it.
        Only for security and info events.
      required: false
      default: false
      selector:
        boolean: null
    image_url:
      name: Image URL
      description: >-
        Optional snapshot/camera image for the notification. Either a path on
        this unit's own Home Assistant (e.g. /media/local/snapshots/x.jpg) or
        an absolute https:// URL. Must be reachable without a Home Assistant
        session — it's fetched directly by the phone's push service, not by
        the app.
      required: false
      selector:
        text: null
    data:
      name: Data
      description: Optional object with extra event data.
      required: false
      selector:
        object: null
change_code:
  name: Change alarm code
  description: Replace the code of Annika's alarm panel. Asks for the current code.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    current_code:
      name: Current code
      required: true
      selector:
        text: null
    new_code:
      name: New code
      required: true
      selector:
        text: null
set_rule:
  name: Set alarm rule
  description: What a zone, or one of its sensors, does in a mode.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    target: {name: Target, required: true, selector: {select: {options: [zone, sensor]}}}
    id: {name: Id, required: true, selector: {text: null}}
    mode: {name: Mode, required: true, selector: {select: {options: [away, night, vacation]}}}
    rule: {name: Rule, required: true, selector: {select: {options: [off, warning, trigger]}}}
set_output:
  name: Set alarm output
  description: What an output does on a warning and on a trigger.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    output: {name: Output, required: true, selector: {text: null}}
    warning_enabled: {name: On warning, selector: {boolean: null}}
    warning_seconds: {name: Warning seconds, selector: {number: {min: 1, max: 86400}}}
    trigger_enabled: {name: On trigger, selector: {boolean: null}}
set_warning:
  name: Set alarm warnings
  description: Warnings before a trigger, and the quiet minutes that reset the count.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    limit: {name: Limit, selector: {number: {min: 1, max: 20}}}
    window_minutes: {name: Window minutes, selector: {number: {min: 1, max: 1440}}}
set_notification:
  name: Set alarm notifications
  description: Whether warnings and triggers notify the people of the house.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    warning: {name: On warning, selector: {boolean: null}}
    trigger: {name: On trigger, selector: {boolean: null}}
test_output:
  name: Test alarm output
  description: Run an output like a warning would, or send a test notification (output "notification").
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    output: {name: Output, required: true, selector: {text: null}}
set_timing:
  name: Set alarm timing
  description: Seconds a mode takes to arm, and seconds to disarm once something trips it.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    mode: {name: Mode, required: true, selector: {select: {options: [away, night, vacation]}}}
    arming: {name: Arming seconds, selector: {number: {min: 0, max: 600}}}
    pending: {name: Delay seconds, selector: {number: {min: 0, max: 600}}}
disarm_without_code:
  name: Disarm without code
  description: Disarm the alarm with no code. Only exists when allow_disarm_without_code is true in the configuration.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
arm_without_code:
  name: Arm without code
  description: Arm the alarm in a mode with no code. Only exists when allow_arm_without_code is true in the configuration.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    mode: {name: Mode, required: true, selector: {select: {options: [away, night, vacation]}}}
