install_resources:
  name: Install resources
  description: Install or update Annika shared resources on Home Assistant.
send_event:
  name: Send event
  description: Sign and send a unit event to Annika's API.
  fields:
    type:
      name: Type
      description: Event type (e.g. security, info).
      required: true
      selector:
        text: null
    message:
      name: Message
      description: Event message content.
      required: true
      selector:
        text: null
    title:
      name: Title
      description: Optional event title.
      required: false
      selector:
        text: null
    actor:
      name: Actor
      description: Optional alias of the person who emitted the event.
      required: false
      selector:
        text: null
    event_id:
      name: Event ID
      description: Optional idempotency key, defaults to a random UUID.
      required: false
      selector:
        text: null
    url:
      name: URL
      description: >-
        Optional Home Assistant dashboard path to open when the resulting
        notification is tapped (e.g. /dashboard-doorbell).
      required: false
      selector:
        text: null
    image_url:
      name: Image URL
      description: >-
        Optional snapshot/camera image for the notification. Either a path on
        this unit's own Home Assistant (e.g. /media/local/snapshots/x.jpg) or
        an absolute https:// URL. Must be reachable without a Home Assistant
        session — it's fetched directly by the phone's push service, not by
        the app.
      required: false
      selector:
        text: null
    data:
      name: Data
      description: Optional object with extra event data.
      required: false
      selector:
        object: null