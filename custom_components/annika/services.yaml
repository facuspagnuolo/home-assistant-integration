install_resources:
  name: Install resources
  description: Install or update Annika shared resources on Home Assistant.
send_event:
  name: Send event
  description: Sign and send a unit event to Annika's API.
  fields:
    type:
      name: Type
      description: Event type (e.g. security, system, info).
      required: true
      selector:
        text: null
    message:
      name: Message
      description: Event message content.
      required: true
      selector:
        text: null
    title:
      name: Title
      description: Optional event title.
      required: false
      selector:
        text: null
    actor:
      name: Actor
      description: >-
        Optional alias of the person who emitted the event. Use "devices" (with
        navigate on) to tell only the unit's paired tablets: nobody gets a
        notification.
      required: false
      selector:
        text: null
    event_id:
      name: Event ID
      description: Optional idempotency key, defaults to a random UUID.
      required: false
      selector:
        text: null
    view:
      name: View
      description: >-
        Path of the dashboard view to open when the resulting notification
        is tapped (e.g. timbre). Each person lands on their own dashboard: the
        view opens there if that dashboard has it, otherwise they land on the
        top of their dashboard. Required for security and info events; not
        used by system events.
      required: false
      selector:
        text: null
    navigate:
      name: Navigate
      description: >-
        Also bring the view up on this unit's paired tablets (the ones that
        don't receive notifications), and take them back to their dashboard
        after two minutes with nobody touching them. Each tablet goes to the
        view inside its own dashboard, and only if that dashboard has it.
        Only for security and info events.
      required: false
      default: false
      selector:
        boolean: null
    image_url:
      name: Image URL
      description: >-
        Optional snapshot/camera image for the notification. Either a path on
        this unit's own Home Assistant (e.g. /media/local/snapshots/x.jpg) or
        an absolute https:// URL. Must be reachable without a Home Assistant
        session — it's fetched directly by the phone's push service, not by
        the app.
      required: false
      selector:
        text: null
    data:
      name: Data
      description: Optional object with extra event data.
      required: false
      selector:
        object: null
change_code:
  name: Change alarm code
  description: Replace the code of Annika's alarm panel. Asks for the current code.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    current_code:
      name: Current code
      required: true
      selector:
        text: null
    new_code:
      name: New code
      required: true
      selector:
        text: null
set_rule:
  name: Set alarm rule
  description: What a zone, or one of its sensors, does in a mode.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    target: {name: Target, required: true, selector: {select: {options: [zone, sensor]}}}
    id: {name: Id, required: true, selector: {text: null}}
    mode: {name: Mode, required: true, selector: {select: {options: [away, night, vacation]}}}
    rule: {name: Rule, required: true, selector: {select: {options: ["off", warning, trigger]}}}
set_output:
  name: Set alarm output
  description: What an output does on a warning and on a trigger.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    output: {name: Output, required: true, selector: {text: null}}
    warning_enabled: {name: On warning, selector: {boolean: null}}
    warning_seconds: {name: Warning seconds, selector: {number: {min: 1, max: 86400}}}
    trigger_enabled: {name: On trigger, selector: {boolean: null}}
set_warning:
  name: Set alarm warnings
  description: Warnings before a trigger, and the quiet minutes that reset the count.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    limit: {name: Limit, selector: {number: {min: 1, max: 20}}}
    window_minutes: {name: Window minutes, selector: {number: {min: 1, max: 1440}}}
    confirm_count: {name: Detections per warning, selector: {number: {min: 1, max: 20}}}
    confirm_window_seconds: {name: Seconds to gather them, selector: {number: {min: 1, max: 3600}}}
    confirm_min_seconds: {name: Seconds a sensor must stay on, selector: {number: {min: 0, max: 3600}}}
    confirm_recount_seconds: {name: Count again every (seconds on), selector: {number: {min: 0, max: 3600}}}
set_notification:
  name: Set alarm notifications
  description: Whether warnings and triggers notify the people of the house.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    warning: {name: On warning, selector: {boolean: null}}
    trigger: {name: On trigger, selector: {boolean: null}}
    trigger_repeat: {name: Repeat while triggered (seconds, 0 = once), selector: {number: {min: 0, max: 3600}}}
test_output:
  name: Test alarm output
  description: Run an output like a warning would, or send a test notification (output "notification").
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    output: {name: Output, required: true, selector: {text: null}}
set_timing:
  name: Set alarm timing
  description: Seconds a mode takes to arm, and seconds to disarm once something trips it.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    mode: {name: Mode, required: true, selector: {select: {options: [away, night, vacation]}}}
    arming: {name: Arming seconds, selector: {number: {min: 0, max: 600}}}
    pending: {name: Delay seconds, selector: {number: {min: 0, max: 600}}}
set_mode_enabled:
  name: Enable or disable an alarm mode
  description: A disabled mode cannot be armed and is hidden from the card. The last enabled mode cannot be disabled; a panel armed in the mode is disarmed.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    mode: {name: Mode, required: true, selector: {select: {options: [away, night, vacation]}}}
    enabled: {name: Enabled, required: true, selector: {boolean: null}}
disarm_without_code:
  name: Disarm without code
  description: Disarm the alarm with no code. Only exists when allow_disarm_without_code is true in the configuration.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
arm_without_code:
  name: Arm without code
  description: Arm the alarm in a mode with no code. Only exists when allow_arm_without_code is true in the configuration.
  target:
    entity:
      integration: annika
      domain: alarm_control_panel
  fields:
    mode: {name: Mode, required: true, selector: {select: {options: [away, night, vacation]}}}
set_camera_rule:
  name: Set what a camera does
  description: What a camera does when it detects a person, vehicle, animal or motion.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    camera: {name: Camera, required: true, selector: {text: null}}
    type: {name: Detection, required: true, selector: {select: {options: [person, vehicle, animal, motion]}}}
    action: {name: Action, description: Leave empty to follow the camera's group., selector: {select: {options: ["off", record, record_notify]}}}
set_group_rule:
  name: Set what a camera group does
  description: What the cameras of a group do for a detection, unless a camera has a rule of its own.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    group: {name: Group, required: true, selector: {text: null}}
    type: {name: Detection, required: true, selector: {select: {options: [person, vehicle, animal, motion]}}}
    action: {name: Action, required: true, selector: {select: {options: ["off", record, record_notify]}}}
set_recording:
  name: Set recording
  description: Seconds recorded before and after a detection, the pause between clips, and days clips are kept.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    before: {name: Seconds before, selector: {number: {min: 0, max: 60}}}
    after: {name: Seconds after, selector: {number: {min: 1, max: 300}}}
    cooldown: {name: Seconds between clips, selector: {number: {min: 0, max: 3600}}}
    keep_days: {name: Days kept, selector: {number: {min: 1, max: 365}}}
set_recording_when:
  name: Set when to record
  description: When detections count, by alarm state and time of day. Armed and time combine with "or".
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    always: {name: Always, selector: {boolean: null}}
    armed: {name: While armed, selector: {boolean: null}}
    armed_modes: {name: Armed modes, selector: {select: {multiple: true, options: [away, night, vacation]}}}
    time: {name: In a time range, selector: {boolean: null}}
    from: {name: From, selector: {time: null}}
    to: {name: To, selector: {time: null}}
delete_clip:
  name: Delete clip
  description: Delete a recorded clip and its picture.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    clip_id: {name: Clip, required: true, selector: {text: null}}
set_doorbell_notification:
  name: Set who a ring is told to
  description: Whether the doorbell's tablets (devices) or the Annika app's people (users) are told when someone rings, when somebody is home and when nobody is.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    target: {name: Recipients, required: true, selector: {select: {options: [devices, users]}}}
    home: {name: When somebody is home, selector: {boolean: null}}
    away: {name: When nobody is home, selector: {boolean: null}}
set_doorbell_presence:
  name: Set who counts as home
  description: Nobody is home when none of these people is.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    people: {name: People, required: true, selector: {entity: {multiple: true, domain: person}}}
set_doorbell_talk:
  name: Set how talking works
  description: Whether the speaker is muted while talking and whether the microphone turns itself off.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    mute_speaker: {name: Mute the speaker while talking, selector: {boolean: null}}
    auto_off: {name: Turn the microphone off by itself, selector: {boolean: null}}
    auto_off_seconds: {name: Seconds before it turns off, selector: {number: {min: 10, max: 600}}}
test_doorbell_notification:
  name: Test the doorbell notification
  description: Send what a ring sends to the devices or to the users, now.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    target: {name: Recipients, required: true, selector: {select: {options: [devices, users]}}}
add_lock_code:
  name: Add a lock code
  description: Program a code, and its emergency code (the same with the last digit as 0), in the locks.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    name: {name: Name, required: true, selector: {text: null}}
    type: {name: Type, selector: {select: {options: [fixed, temporary]}}}
    code: {name: Code, description: 4 to 8 digits, not ending in 0. One is made when it is empty., selector: {text: null}}
    locks: {name: Locks, description: All of them when empty., selector: {entity: {multiple: true, domain: lock}}}
    hours: {name: Valid for (hours), description: Temporary codes, selector: {number: {min: 1, max: 720}}}
    until: {name: Valid until, description: Temporary codes, selector: {datetime: null}}
delete_lock_code:
  name: Delete a lock code
  description: Remove a code and its emergency code from the locks.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    id: {name: Code, required: true, selector: {text: null}}
import_lock_codes:
  name: Import the codes of the locks
  description: Adopt the codes the locks already hold in Annika's slots, named after their slot, and give each its emergency code.
  target:
    entity:
      integration: annika
      domain: sensor
rename_lock_code:
  name: Rename a lock code
  description: Change the name of a code.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    id: {name: Code, required: true, selector: {text: null}}
    name: {name: Name, required: true, selector: {text: null}}
set_lock_rule:
  name: Set the disarm rule
  description: Disarm the alarm when a door is unlocked, while it is armed in one of these modes.
  target:
    entity:
      integration: annika
      domain: sensor
  fields:
    enabled: {name: Enabled, selector: {boolean: null}}
    locks: {name: Locks, description: Every lock when empty., selector: {entity: {multiple: true, domain: lock}}}
    modes: {name: Modes, description: Any mode when empty., selector: {select: {multiple: true, options: [away, night, vacation]}}}
test_lock_rule:
  name: Test the disarm rule
  description: Put a test line in the activity, without disarming the alarm or moving a lock.
  target:
    entity:
      integration: annika
      domain: sensor
